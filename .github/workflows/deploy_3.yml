---
name: 'deploy_3'

on:
  push:
    branches:
      - 3.x
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
    contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cloning repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push to dokku
        uses: dokku/github-action@cc7dec1d2b9fed249a14ae462bc953bba436f78c # v1.10.0
        with:
          branch: '3.x'
          git_remote_url: 'ssh://dokku@apps.cakephp.org:22/newbook-3'
          git_push_flags: '-f'
          ssh_private_key: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
